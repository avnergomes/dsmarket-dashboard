name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Check if data already exists (skip Python processing if so)
      - name: Check for existing data
        id: check-data
        run: |
          if [ -f "dashboard/public/data/aggregated.json" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
            echo "Data files found - skipping Python processing"
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "No data files - will run Python processing"
          fi

      # Python setup and data processing (only if data doesn't exist)
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: steps.check-data.outputs.data_exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: steps.check-data.outputs.data_exists == 'false'
        run: pip install -r requirements.txt

      - name: Run ETL process
        if: steps.check-data.outputs.data_exists == 'false'
        run: python scripts/etl_process.py

      - name: Preprocess data
        if: steps.check-data.outputs.data_exists == 'false'
        run: python scripts/preprocess_data.py

      - name: Run clustering analysis
        if: steps.check-data.outputs.data_exists == 'false'
        run: python scripts/clustering.py

      - name: Generate forecasts
        if: steps.check-data.outputs.data_exists == 'false'
        run: python scripts/generate_forecasts.py

      # Node.js setup and dashboard build
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install npm dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dashboard/dist/index.html ]; then
            echo "Error: Build failed - index.html not found"
            exit 1
          fi
          echo "Build successful - $(find dashboard/dist -type f | wc -l) files generated"

      # GitHub Pages deployment preparation
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
